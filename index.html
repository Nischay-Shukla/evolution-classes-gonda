  /* ===================== enquiry form ===================== */
  var EMPTY = { student: '', parent: '', phone: '', cls: '', subject: '', message: '' };

  function validate(v) {
    var e = {};
    if (v.student.trim().length < 2) e.student = 'Enter the student’s name.';
    if (!/^[6-9]\d{9}$/.test(normPhone(v.phone))) e.phone = 'Enter a valid 10-digit mobile number.';
    if (!v.cls) e.cls = 'Choose the class.';
    return e;
  }

  function Field(p) {
    return html`<div className=${p.className || ''}>
      <label htmlFor=${p.id} className="label">${p.label}${p.optional ? html`<span className="ml-2 font-normal normal-case tracking-normal text-[var(--muted-strong)]">(optional)</span>` : null}</label>
      ${p.children}
      ${p.error ? html`<p id=${p.id + '-err'} role="alert" className="mt-2 text-[13px] text-[var(--danger)]">${p.error}</p>` : null}
    </div>`;
  }

  function EnquiryForm(p) {
    var s1 = useState(EMPTY), v = s1[0], setV = s1[1];
    var s2 = useState({}), err = s2[0], setErr = s2[1];
    var s3 = useState('idle'), status = s3[0], setStatus = s3[1];
    var s4 = useState(null), sent = s4[0], setSent = s4[1];
    var nameRef = useRef(null);

    useEffect(function () {
      if (!p.prefill.nonce) return;
      setV(function (x) { return Object.assign({}, x, { cls: p.prefill.cls || x.cls }); });
      setStatus('idle');
      var t = setTimeout(function () { if (nameRef.current) nameRef.current.focus({ preventScroll: true }); }, 700);
      return function () { clearTimeout(t); };
    }, [p.prefill.nonce]);

    function set(k) {
      return function (e) {
        var val = e.target.value;
        setV(function (x) { var n = Object.assign({}, x); n[k] = val; return n; });
        if (err[k]) setErr(function (x) { var n = Object.assign({}, x); delete n[k]; return n; });
      };
    }
    function a11y(k) {
      return { 'aria-invalid': err[k] ? 'true' : 'false', 'aria-describedby': err[k] ? 'f-' + k + '-err' : undefined };
    }
    async function onSubmit(e) {
      e.preventDefault();
      var er = validate(v);
      setErr(er);
      var keys = Object.keys(er);
      if (keys.length) { var el = document.getElementById('f-' + keys[0]); if (el) el.focus(); return; }
      setStatus('sending');
      var payload = Object.assign({}, v, { phone: normPhone(v.phone) });
      try {
        if (CONFIG.form.endpoint) {
          var r = await fetch(CONFIG.form.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!r.ok) throw new Error('failed');
        }
        setSent(payload);
        setStatus('sent');
      } catch (x) { setStatus('error'); }
    }
    function reset() { setV(EMPTY); setErr({}); setSent(null); setStatus('idle'); }

    if (status === 'sent' && sent) {
      var live = !!CONFIG.form.endpoint;
      var first = sent.student.trim().split(/\s+/)[0];
      var msg = 'Hello Evolution Classes, I would like to enquire about admission to Class ' + sent.cls + (sent.subject ? ' (' + sent.subject + ')' : '') + '. Student: ' + sent.student.trim() + '.' + (sent.parent.trim() ? ' Parent/Guardian: ' + sent.parent.trim() + '.' : '') + ' Phone: ' + sent.phone + '.' + (sent.message.trim() ? ' Message: ' + sent.message.trim() : '');
      return html`<div role="status" aria-live="polite" className="flex h-full flex-col justify-center">
        <span className="inline-flex h-12 w-12 items-center justify-center border border-[var(--green)] text-[var(--green)]">${ICONS.check}</span>
        <h3 className="h3 mt-8">Thank you, ${first}.</h3>
        <p className="mt-4 max-w-[30rem] text-[1rem] leading-relaxed text-[var(--muted-strong)]">
          ${live
            ? 'We have received your enquiry for Class ' + sent.cls + '. The admissions team will contact you on ' + sent.phone + '.'
            : 'One last step. Send your enquiry for Class ' + sent.cls + (sent.subject ? ', ' + sent.subject : '') + ' on WhatsApp so the admissions team receives it and can reply to you.'}
        </p>
        <div className="mt-8 flex flex-wrap gap-3">
          <a className="btn btn-solid" href=${waLink(msg)} target="_blank" rel="noopener noreferrer">${live ? 'Message us on WhatsApp' : 'Send on WhatsApp'} ${ICONS.out}</a>
          <button type="button" className="btn btn-line" onClick=${reset}>Submit another enquiry</button>
        </div>
      </div>`;
    }

    return html`<form onSubmit=${onSubmit} noValidate aria-label="Admission enquiry form">
      <div className="grid gap-x-8 gap-y-8 md:grid-cols-2">
        <${Field} id="f-student" label="Student name" error=${err.student}>
          <input id="f-student" ref=${nameRef} className="input" type="text" autoComplete="name" required value=${v.student} onChange=${set('student')} ...${a11y('student')} />
        <//>
        <${Field} id="f-parent" label="Parent or guardian" optional=${true}>
          <input id="f-parent" className="input" type="text" autoComplete="off" value=${v.parent} onChange=${set('parent')} />
        <//>
        <${Field} id="f-phone" label="Phone number" error=${err.phone}>
          <input id="f-phone" className="input" type="tel" inputMode="tel" autoComplete="tel" placeholder="10-digit mobile number" required value=${v.phone} onChange=${set('phone')} ...${a11y('phone')} />
        <//>
        <${Field} id="f-cls" label="Class" error=${err.cls}>
          <div className="relative">
            <select id="f-cls" className="input appearance-none pr-8" required value=${v.cls} onChange=${set('cls')} ...${a11y('cls')}>
              <option value="">Select class</option>
              ${CONFIG.form.classes.map(function (c) { return html`<option key=${c} value=${String(c)}>Class ${c}</option>`; })}
            </select>
            <span className="pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 text-[var(--muted-strong)]">${ICONS.caret}</span>
          </div>
        <//>
        <${Field} id="f-subject" label="Subject of interest" className="md:col-span-2">
          <div className="relative">
            <select id="f-subject" className="input appearance-none pr-8" value=${v.subject} onChange=${set('subject')}>
              <option value="">Select subject</option>
              ${CONFIG.form.subjects.map(function (s) { return html`<option key=${s} value=${s}>${s}</option>`; })}
            </select>
            <span className="pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 text-[var(--muted-strong)]">${ICONS.caret}</span>
          </div>
        <//>
        <${Field} id="f-message" label="Message" optional=${true} className="md:col-span-2">
          <textarea id="f-message" className="input" rows="4" placeholder="Anything you would like us to know" value=${v.message} onChange=${set('message')}></textarea>
        <//>
      </div>
      <div className="mt-10 flex flex-wrap items-center gap-x-6 gap-y-4">
        <button type="submit" className="btn btn-solid" disabled=${status === 'sending'}>${status === 'sending' ? 'Sending' : 'Send Enquiry'} ${ICONS.arrow}</button>
        ${status === 'error' ? html`<p role="alert" className="text-[13px] text-[var(--danger)]">The enquiry could not be sent. Check your connection and try again, or use WhatsApp.</p>` : null}
      </div>
    </form>`;
  }

  function Footer() {
    var B = CONFIG.brand, C = CONFIG.contact;
    var year = new Date().getFullYear();
    return html`<footer className="gutter border-t border-[var(--line)] pt-20">
      <div className="mx-auto max-w-[1320px]">
        <div className="grid gap-12 md:grid-cols-12">
          <div className="md:col-span-5">
            <${Wordmark} />
            <p className="mt-6 max-w-[26rem] text-[0.95rem] leading-relaxed text-[var(--muted-strong)]">${B.description}</p>
          </div>
          <nav aria-label="Footer" className="md:col-span-2">
            <p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-[var(--ink)]">Navigate</p>
            <ul className="mt-5 flex flex-col gap-3 text-[0.95rem]">
              ${NAV().map(function (n) { return html`<li key=${n[0]}><a className="flink" href=${'#' + n[0]} onClick=${function (e) { e.preventDefault(); go(n[0]); }}>${n[1]}</a></li>`; })}
            </ul>
          </nav>
          <div className="md:col-span-2">
            <p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-[var(--ink)]">Courses</p>
            <ul className="mt-5 flex flex-col gap-3 text-[0.95rem]">
              ${CONFIG.form.classes.map(function (c) { return html`<li key=${c}><a className="flink" href="#courses" onClick=${function (e) { e.preventDefault(); go('courses'); }}>Class ${c}</a></li>`; })}
            </ul>
          </div>
          <div className="md:col-span-3">
            <p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-[var(--ink)]">Contact</p>
            <ul className="mt-5 flex flex-col gap-3 text-[0.95rem] text-[var(--muted-strong)]">
              <li>${C.address ? C.address + ', ' : html`<${Tbc}>[Address]<//>`}${C.address ? null : ', '}Gonda, Uttar Pradesh</li>
              ${C.phones.length ? C.phones.map(function (n) { return html`<li key=${n}>${n}</li>`; }) : html`<li><${Tbc}>+91 XXXXX XXXXX<//></li>`}
            </ul>
            <ul className="mt-6 flex flex-wrap gap-x-5 gap-y-2 text-[0.9rem]" aria-label="Social media">
              ${CONFIG.social.filter(function (s) { return s.href; }).map(function (s) {
                return html`<li key=${s.label}><a className="flink" href=${s.href} target="_blank" rel="noopener noreferrer">${s.label}</a></li>`;
              })}
            </ul>
          </div>
        </div>
        <div className="mt-16 flex flex-col justify-between gap-2 border-t border-[var(--line)] py-6 text-[12px] text-[var(--muted-strong)] sm:flex-row">
          <p>© ${year} Evolution Classes. All rights reserved.</p>
        </div>
      </div>
      <div className="overflow-hidden" aria-hidden="true">
        <div className="select-none whitespace-nowrap pb-6 pt-4 font-serif font-medium leading-[1.15] tracking-tight" style=${{ fontSize: 'clamp(2.5rem, 10vw, 9rem)', paddingLeft: '0.04em', paddingRight: '0.04em', color: '#cdebd7' }}>Evolution Classes</div>
      </div>
    </footer>`;
  }

  function FloatingWhatsApp() {
    return html`<a className="fab" href=${waLink('Hello Evolution Classes, I would like to know more about admissions.')} target="_blank" rel="noopener noreferrer" aria-label="Chat with Evolution Classes on WhatsApp">
      ${ICONS.chat}<span className="hidden sm:inline">WhatsApp</span>
    </a>`;
  }

  /* ===================== app ===================== */
  var SECTION_IDS = ['home', 'about', 'courses', 'faculty', 'philosophy', 'results', 'gallery', 'contact'];

  function useActive() {
    var s = useState('home'), a = s[0], setA = s[1];
    useEffect(function () {
      if (!('IntersectionObserver' in window)) return;
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) setA(e.target.id); });
      }, { rootMargin: '-45% 0px -50% 0px' });
      SECTION_IDS.forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
      return function () { io.disconnect(); };
    }, []);
    return a;
  }

  function App() {
    var s = useState({ cls: '', nonce: 0 }), prefill = s[0], setPrefill = s[1];
    var active = useActive();
    function onEnquire(cls) {
      setPrefill(function (p) { return { cls: cls ? String(cls) : '', nonce: p.nonce + 1 }; });
      go('contact');
    }
    return html`<div>
      <a href="#about" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[70] focus:bg-white focus:px-4 focus:py-2" onClick=${function (e) { e.preventDefault(); go('about'); }}>Skip to content</a>
      <${Header} active=${active === 'philosophy' ? 'faculty' : active === 'gallery' ? (hasResults() ? 'results' : 'faculty') : active} onEnquire=${onEnquire} />
      <main>
        <${Hero} onEnquire=${onEnquire} />
        <${About} />
        <${Courses} onEnquire=${onEnquire} />
        <${Faculty} />
        <${Philosophy} />
        ${hasResults() ? html`<${Results} />` : null}
        <${Gallery} />
        <${Contact} prefill=${prefill} />
      </main>
      <${Footer} />
      <${FloatingWhatsApp} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>

</body></html>
